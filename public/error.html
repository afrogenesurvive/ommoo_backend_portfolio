<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f8f9fa;
      font-family: Arial, sans-serif;
    }
    .card {
      background-color: #ffffff;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      padding: 20px 40px;
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    .card h1 {
      font-size: 24px;
      color: #dc3545;
      margin-bottom: 10px;
    }
    .card p {
      font-size: 16px;
      color: #6c757d;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Error</h1>
    <p><strong>User did not authorize the request.</strong></p>
  </div>
</body>
</html>
